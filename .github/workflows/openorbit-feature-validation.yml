name: OpenOrbit feature validation

on:
  push:
    branches:
      - feature/remote-friend-saves-and-cbs-shield
  workflow_dispatch:

jobs:
  syntax-and-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile Python sources
        run: python -m compileall -q server
      - name: Validate panel translations
        run: |
          python -m json.tool server/panel/arayuz/pl.json > /dev/null
          python -m json.tool server/panel/arayuz/en.json > /dev/null
      - name: Validate panel JavaScript
        run: |
          node --check server/panel/arayuz/panel.js
          node --check server/panel/arayuz/kayit.js
