name: OpenOrbit feature validation

on:
  push:
    branches:
      - feature/remote-friend-saves-and-cbs-shield
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  syntax-and-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile Python sources
        run: python -m compileall -q server
      - name: Validate panel translations
        run: |
          python -m json.tool server/panel/arayuz/pl.json > /dev/null
          python -m json.tool server/panel/arayuz/en.json > /dev/null
      - name: Exercise host-authoritative friend save storage
        env:
          PYTHONPATH: server
        run: |
          python - <<'PY'
          import copy
          import json
          import tempfile
          import cok_oyunculu as multiplayer

          multiplayer.YOL.KAYITLAR = tempfile.mkdtemp(prefix="openorbit-friend-saves-")
          key = "K" * 48
          slot, digest = multiplayer._friend_slot(key)
          original = {
              "pilot": {"userId": 123456, "userName": "TestPilot"},
              "gemi": {},
              "konum": {"mapId": 1, "x": 100, "y": 200},
          }
          guest_profile = copy.deepcopy(original)
          guest_profile["pilot"]["userId"] = 2000000123
          guest = multiplayer.Misafir(
              "session", "session-secret", 2000000123, 123456,
              "127.0.0.1", "127.0.0.1", slot, digest
          )
          guest.zapisla(json.dumps(guest_profile))
          assert multiplayer._friend_load(slot, digest) == original

          edited = copy.deepcopy(original)
          edited["pilot"]["userName"] = "HostEditedPilot"
          guest.zapisla(json.dumps({**edited, "pilot": {**edited["pilot"], "userId": 2000000123}}))
          assert multiplayer._friend_load(slot, digest) == edited

          try:
              multiplayer._friend_load(slot, "0" * 64)
          except ValueError:
              pass
          else:
              raise AssertionError("A mismatched friend identity must never load another profile")
          PY
      - name: Validate panel JavaScript
        run: |
          node --check server/panel/arayuz/panel.js
          node --check server/panel/arayuz/kayit.js
          node --check server/panel/arayuz/botlar.js
      - name: Import offline bot simulation
        env:
          PYTHONPATH: server:server/panel
        run: |
          python - <<'PY'
          from bot_offline import SymulacjaOffline
          from bot.yonetici import Yonetici
          from bot import yonetici as BOT_MANAGER
          from botlar import AYARLAR
          from bot.kisilik import rol
          assert callable(SymulacjaOffline)
          assert 'offline' in Yonetici.__init__.__code__.co_varnames
          assert 'offline_tick' in Yonetici.telafi.__code__.co_varnames
          assert BOT_MANAGER.VARSAYILAN['izinler']['klan_ksi'] is True
          assert AYARLAR['telafi_saat'] == ('tam', 0, 150, 150)
          assert rol({'arketip': 'lider', 'ozellik': {}}) == 'destek'

          # Drive the real offline service with an empty basic-mode package to verify
          # game-stop, game-start pause and a fresh offline window after the next stop.
          import json
          import os
          import tempfile
          import threading

          with tempfile.TemporaryDirectory() as root:
              package = {'dunya': 'standart', 'kip': 'basit', 'kadro': [],
                         'ayarlar': {'telafi_saat': 1, 'telafi_oran': 1.0}}
              package_path = os.path.join(root, 'demo.json')
              with open(package_path, 'w', encoding='utf8') as fh:
                  json.dump(package, fh)

              class FakeBotStore:
                  _KILIT = threading.RLock()
                  def liste_kimlik(self):
                      return ['demo']
                  def dosya_yolu(self, pid):
                      return package_path
                  def durum_yolu(self, pid):
                      return os.path.join(root, pid, 'durum.json')
                  def oku(self, pid):
                      return package

              running = {'game': False}
              sim = SymulacjaOffline(FakeBotStore(), lambda: not running['game'], log=lambda _: None)
              sim.tick(1000)  # panel noticed that the game is closed
              sim.tick(1300)  # 300 seconds of offline time
              meta_path = os.path.join(root, 'demo', 'offline.json')
              with open(meta_path, encoding='utf8') as fh:
                  meta = json.load(fh)
              assert meta['used_seconds'] == 300
              assert meta['sim_time'] == 1300

              running['game'] = True
              sim.tick(1301)  # game started: save and pause
              with open(meta_path, encoding='utf8') as fh:
                  meta = json.load(fh)
              assert meta['paused'] is True and meta['used_seconds'] == 0

              running['game'] = False
              sim.tick(1400)  # next offline period starts
              sim.tick(1700)
              with open(meta_path, encoding='utf8') as fh:
                  meta = json.load(fh)
              assert meta['used_seconds'] == 300
              assert meta['sim_time'] == 1700
          PY
