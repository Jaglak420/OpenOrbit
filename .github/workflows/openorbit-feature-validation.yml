name: OpenOrbit feature validation

on:
  push:
    branches:
      - feature/remote-friend-saves-and-cbs-shield
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  syntax-and-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile Python sources
        run: python -m compileall -q server
      - name: Validate panel translations
        run: |
          python -m json.tool server/panel/arayuz/pl.json > /dev/null
          python -m json.tool server/panel/arayuz/en.json > /dev/null
      - name: Exercise host-authoritative friend save storage
        env:
          PYTHONPATH: server
        run: |
          python - <<'PY'
          import copy
          import json
          import tempfile
          import cok_oyunculu as multiplayer

          multiplayer.YOL.KAYITLAR = tempfile.mkdtemp(prefix="openorbit-friend-saves-")
          key = "K" * 48
          slot, digest = multiplayer._friend_slot(key)
          original = {
              "pilot": {"userId": 123456, "userName": "TestPilot"},
              "gemi": {},
              "konum": {"mapId": 1, "x": 100, "y": 200},
          }
          guest_profile = copy.deepcopy(original)
          guest_profile["pilot"]["userId"] = 2000000123
          guest = multiplayer.Misafir(
              "session", "session-secret", 2000000123, 123456,
              "127.0.0.1", "127.0.0.1", slot, digest
          )
          guest.zapisla(json.dumps(guest_profile))
          assert multiplayer._friend_load(slot, digest) == original

          edited = copy.deepcopy(original)
          edited["pilot"]["userName"] = "HostEditedPilot"
          guest.zapisla(json.dumps({**edited, "pilot": {**edited["pilot"], "userId": 2000000123}}))
          assert multiplayer._friend_load(slot, digest) == edited

          try:
              multiplayer._friend_load(slot, "0" * 64)
          except ValueError:
              pass
          else:
              raise AssertionError("A mismatched friend identity must never load another profile")
          PY

      - name: Exercise bot account equipment upgrades
        env:
          PYTHONPATH: server
        run: |
          python - <<'PY'
          import random
          from bot import katalog as K
          from bot.durum import Bot
          from bot.kisilik import kisilik_uret
          from bot.hedefler import alisveris as ALIS

          best_laser = max(K.lazerler(), key=K.lazerler().get)

          def make_bot(no, name, credits, uridium, drones, laser_count):
              return Bot({
                  "no": no, "ad": name, "firma": 1,
                  "kisilik": kisilik_uret(random.Random(no), arketip="kasici"),
                  "seviye": 20, "ep": 0, "kredi": credits, "uridyum": uridium, "onur": 1000,
                  "ekip": {
                      "gemi": "ship_phoenix", "lazer": {best_laser: laser_count}, "kalkan": {}, "hiz": {},
                      "dron": drones, "cephane": K.CEPHANE[0],
                  },
              })

          pilot = make_bot(991, "UpgradeTest", 5000000, 1000000,
                           {"drone_flax": 7, "drone_iris": 1}, 40)
          starting_uridium = pilot.k["uridyum"]
          for _ in range(7):
              pilot._adaylar = None
              upgrades = [c for c in ALIS.adaylar(pilot)
                          if c[3] == "drone_iris" and len(c) > 4 and c[4] == "drone_flax"]
              assert upgrades, "A full hangar must offer Iris-for-Flax replacement"
              assert ALIS.satin_al(pilot, upgrades[0]), "The bot should be able to buy the Iris upgrade"
          assert pilot.k["ekip"]["dron"].get("drone_iris") == 8
          assert pilot.k["ekip"]["dron"].get("drone_flax", 0) == 0
          assert sum(pilot.k["ekip"]["dron"].values()) == K.ESYA["dron_azami"]
          assert pilot.k["uridyum"] < starting_uridium
          pilot._adaylar = None
          assert not any(c[3] == "drone_flax" and len(c) > 4 and c[4] == "drone_iris"
                         for c in ALIS.adaylar(pilot)), "A higher-tier drone must never be downgraded"

          credit_pilot = make_bot(992, "CreditUpgradeTest", 500000, 0, {}, 1)
          starting_credits = credit_pilot.k["kredi"]
          credit_pilot._adaylar = None
          flax = next(c for c in ALIS.adaylar(credit_pilot) if c[3] == "drone_flax")
          assert ALIS.satin_al(credit_pilot, flax)
          assert credit_pilot.k["kredi"] < starting_credits
          PY

      - name: Verify Dispatch gate expedition list
        env:
          PYTHONPATH: server
        run: |
          python - <<'PY'
          from dispatch import Dispatch, AVAILABLE, IN_PROGRESS, READY
          import kapi as GATES

          class Profile:
              def __init__(self):
                  self.d = {}

          profile = Profile()
          dispatch = Dispatch(profile, kapilar=None, log=lambda _: None)
          expected = {g["kimlik"] for key, g in GATES.KAPI.items() if key != "hades"}

          # A fresh profile must still receive the full gate catalogue.
          login = dispatch.login_msgs()
          login_gate = next((f for name, f in login if name == "DispatchGetGateListCommand"), None)
          assert login_gate is not None, "The Expedition window bootstrap must include a Gate list"
          assert {g["gateId"] for g in login_gate["gateList"]} == expected
          assert len(login_gate["gateList"]) == len(expected)
          assert all(g["status"] == AVAILABLE for g in login_gate["gateList"])

          # The explicit tab request must return the same populated catalogue.
          explicit = dispatch.handle("DispatchGetGateListRequest", {})
          assert len(explicit) == 1 and explicit[0][0] == "DispatchGetGateListCommand"
          assert {g["gateId"] for g in explicit[0][1]["gateList"]} == expected

          # Opening the main Dispatch window from either tab also primes the Gate tab.
          retrievers = dispatch.retriever_list(AVAILABLE, now=1000)
          assert any(name == "DispatchGetGateListCommand" for name, _ in retrievers)

          # Active expeditions keep their in-progress/collectible state.
          profile.d["dispatch"] = {"yuva": 2, "gonderilen": {}, "kapilar": {"alpha": 1500}}
          active = dispatch.gate_list(now=1000)[0][1]["gateList"]
          alpha = next(g for g in active if g["gateId"] == GATES.KAPI["alpha"]["kimlik"])
          assert alpha["status"] == IN_PROGRESS and alpha["timeLeft"] == 500
          ready = dispatch.gate_list(now=1500)[0][1]["gateList"]
          alpha = next(g for g in ready if g["gateId"] == GATES.KAPI["alpha"]["kimlik"])
          assert alpha["status"] == READY and alpha["timeLeft"] == 0
          PY
      - name: Validate panel JavaScript
        run: |
          node --check server/panel/arayuz/panel.js
          node --check server/panel/arayuz/kayit.js
          node --check server/panel/arayuz/botlar.js
      - name: Import offline bot simulation
        env:
          PYTHONPATH: server:server/panel
        run: |
          python - <<'PY'
          from bot_offline import SymulacjaOffline
          from bot.yonetici import Yonetici
          from bot import yonetici as BOT_MANAGER
          from botlar import AYARLAR
          from bot.kisilik import rol
          assert callable(SymulacjaOffline)
          assert 'offline' in Yonetici.__init__.__code__.co_varnames
          assert 'offline_tick' in Yonetici.telafi.__code__.co_varnames
          assert BOT_MANAGER.VARSAYILAN['izinler']['klan_ksi'] is True
          assert AYARLAR['telafi_saat'] == ('tam', 0, 150, 150)
          assert rol({'arketip': 'lider', 'ozellik': {}}) == 'destek'

          # Drive the real offline service with an empty basic-mode package to verify
          # game-stop, game-start pause and a fresh offline window after the next stop.
          import json
          import os
          import tempfile
          import threading

          with tempfile.TemporaryDirectory() as root:
              package = {'dunya': 'standart', 'kip': 'basit', 'kadro': [],
                         'ayarlar': {'telafi_saat': 1, 'telafi_oran': 1.0}}
              package_path = os.path.join(root, 'demo.json')
              with open(package_path, 'w', encoding='utf8') as fh:
                  json.dump(package, fh)

              class FakeBotStore:
                  _KILIT = threading.RLock()
                  def liste_kimlik(self):
                      return ['demo']
                  def dosya_yolu(self, pid):
                      return package_path
                  def durum_yolu(self, pid):
                      return os.path.join(root, pid, 'durum.json')
                  def oku(self, pid):
                      return package

              running = {'game': False}
              sim = SymulacjaOffline(FakeBotStore(), lambda: not running['game'], log=lambda _: None)
              sim.tick(1000)  # panel noticed that the game is closed
              sim.tick(1300)  # 300 seconds of offline time
              meta_path = os.path.join(root, 'demo', 'offline.json')
              with open(meta_path, encoding='utf8') as fh:
                  meta = json.load(fh)
              assert meta['used_seconds'] == 300
              assert meta['sim_time'] == 1300

              running['game'] = True
              sim.tick(1301)  # game started: save and pause
              with open(meta_path, encoding='utf8') as fh:
                  meta = json.load(fh)
              assert meta['paused'] is True and meta['used_seconds'] == 0

              running['game'] = False
              sim.tick(1400)  # next offline period starts
              sim.tick(1700)
              with open(meta_path, encoding='utf8') as fh:
                  meta = json.load(fh)
              assert meta['used_seconds'] == 300
              assert meta['sim_time'] == 1700
          PY
